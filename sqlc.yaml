version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/storage/postgres/queries"
    schema: "migrations"
    gen:
      go:
        package: "postgres"
        out: "internal/storage/postgres"
        emit_json_tags: true
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
