services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orcta_pay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orcta_pay}
      POSTGRES_DB: ${POSTGRES_DB:-orcta_pay}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orcta_pay} -d ${POSTGRES_DB:-orcta_pay}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    command:
      - valkey-server
      - --appendonly
      - "no"
      - --save
      - "3600 1"
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  valkey_data:
