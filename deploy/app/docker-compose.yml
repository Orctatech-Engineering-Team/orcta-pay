# Orcta Pay API — Deployed by Orcta Runtime via Kamal Proxy (Blue/Green)
# Path on VPS: /srv/apps/orcta-pay/
#
# 1. NO container_name or host ports.
# 2. Primary service MUST be named `web`.
# 3. Internal app port MUST be 8080.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-image: &image ghcr.io/orctatech-engineering-team/orcta-pay:${DEPLOY_SHA:?DEPLOY_SHA must be set — Orcta sets it per deploy}

services:
  migrate:
    image: *image
    logging: *logging
    entrypoint: ["/usr/local/bin/migrate"]
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "${MIGRATION_DATABASE_URL}"
      - "up"
    env_file:
      - .env
    networks:
      - orcta_net
    restart: "no"

  web:
    image: *image
    logging: *logging
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - orcta_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8085/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: *image
    logging: *logging
    entrypoint: ["/usr/local/bin/worker"]
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - orcta_net
    healthcheck:
      disable: true

networks:
  orcta_net:
    external: true
